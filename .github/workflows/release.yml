name: release

# Push a tag like v0.2.0 whose number matches Cargo.toml. The release is
# built, packed as archive, Debian package and AppImage
# (packaging/build-packages.sh) and published as the latest release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The oldest supported Ubuntu, so the program runs on as many systems as
    # possible (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 == "## " v || index($0, "## " v " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Packages
        run: packaging/build-packages.sh "${GITHUB_REF_NAME#v}"
      - name: Upload as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "rustpad++ $GITHUB_REF_NAME" --notes-file notes.md dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
